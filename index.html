  if(directions.size)dest=null;
  else if(dest){let distance=Math.hypot(dest.x-s.boat.x,dest.y-s.boat.y);if(distance<8&&Math.hypot(motion.vx,motion.vy)<20){dest=null;toast='도착! 가까운 물고기를 눌러 낚시해요.';}else{let brake=Math.min(1,distance/65);input={x:(dest.x-s.boat.x)/Math.max(1,distance)*brake,y:(dest.y-s.boat.y)/Math.max(1,distance)*brake};}}
  let speed=Motion.step(s.boat,motion,input,dt,safe)||0;
  wakeClock+=dt;if(speed>35&&wakeClock>.09){wakeClock=0;wake.push({x:s.boat.x-Math.cos(motion.angle)*31,y:s.boat.y-Math.sin(motion.angle)*31,life:1});}
  for(let f of fish){if(f.cooldown>0)f.cooldown-=dt;else Motion.swim(f,t);}
 }else{motion.vx=motion.vy=0;}
 for(let w of wake)w.life-=dt*.8;while(wake.length&&wake[0].life<=0)wake.shift();
 let tx=Math.max(0,Math.min(WORLD.w-cw,s.boat.x-cw/2)),ty=Math.max(0,Math.min(WORLD.h-ch,s.boat.y-ch/2));cam.x+=(tx-cam.x)*Math.min(1,dt*4);cam.y+=(ty-cam.y)*Math.min(1,dt*4);draw(t);
 let b=document.getElementById('cast');b.disabled=!!s.q;let label=nearest?(Sea.req[nearest.i]<=s.rod?'낚시하기<small>'+Sea.names[nearest.i]+'</small>':'강화 필요<small>Lv.'+Sea.req[nearest.i]+' 낚싯대</small>'):'낚시하기<small>물고기에 가까이!</small>';if(label!==lastCastText){b.innerHTML=label;lastCastText=label;}
 document.getElementById('message').textContent=s.misses>=2&&!s.q?'다음 정답 낚시는 성공 보장! 원하는 물고기를 찾아요.':toast;if(t-lastSave>2000){save();lastSave=t;}requestAnimationFrame(frame);
}
function cast(){if(s.q)return;if(!nearest){toast='물고기 가까이 이동해 주세요. 물고기를 누르면 그쪽으로 가요.';return;}if(Sea.req[nearest.i]>s.rod){toast='이 물고기는 Lv.'+Sea.req[nearest.i]+' 장비가 필요해요. 작은 물고기로 코인을 모아요.';return;}dest=null;if(Sea.begin(s,nearest.i)){save();refresh();}}
function settle(r){if(!r)return;if(r.type==='wrong'){save();overlay();return;}reeling=true;save();refresh();setTimeout(()=>{reeling=false;refresh();},1100);}
function modal(html){let d=document.getElementById('modal');d.innerHTML=html+btn('close','닫기','button close');d.showModal();}
function shop(){if(s.q)return;modal(`<h2>낚시도구 공방</h2><p>낚싯대가 강해지면 더 큰 물고기를 낚고, 작은 물고기를 잡기도 쉬워져요.</p><div class="shop-item"><h3>낚싯대 Lv.${s.rod}${s.rod<5?' → Lv.'+(s.rod+1):' · 최고 단계'}</h3><p>${s.rod<5?'새로 도전할 물고기: '+Sea.names.filter((_,i)=>Sea.req[i]===s.rod+1).join(', '):'모든 물고기에 도전할 수 있어요!'}</p><p>강화는 항상 성공해요.</p>${s.rod<5?btn('upgrade',Sea.prices[s.rod-1]+'코인 · 강화하기','button gold wide',s.coins<Sea.prices[s.rod-1]):''}</div><p>현재 ${s.coins}코인 · 놓쳐도 학습 코인 3개를 받아요.</p>`);}
function book(){modal(`<h2>반짝바다 물고기 도감</h2><p>${s.counts.filter(Boolean).length}/12종 발견 · ${s.solved}문제 학습</p><div class="collection">${Sea.names.map((name,i)=>'<div class="specimen">'+fishArt(i,!s.counts[i])+'<strong>'+(s.counts[i]?name:'???')+'</strong><small>필요 장비 Lv.'+Sea.req[i]+'</small><small>'+(s.counts[i]?s.counts[i]+'마리 · '+s.records[i]+'cm':'아직 만나지 못했어요')+'</small></div>').join('')}</div>`);}
function settings(){if(student)return;modal(`<h2>선생님 설정</h2><p>연습할 단을 고릅니다.</p><div class="checks">${[2,3,4,5,6,7,8,9].map(n=>'<label><input type="checkbox" name="dan" value="'+n+'" '+(s.dans.includes(n)?'checked':'')+'> '+n+'단</label>').join('')}</div>${btn('apply','단 선택 적용','button primary')}<p>설정은 이 기기에 저장합니다. 공유 링크에는 선택한 단을 포함할 수 있어요.</p>${btn('reset-confirm','새 수업 · 기록 초기화')}`);}
function share(){modal('<h2>HTML 파일로 배포하기</h2><p>아래 버튼으로 학생용 게임 파일을 내려받아 학급 게시판이나 학습 플랫폼에 첨부해 주세요. 학생들은 파일을 저장한 뒤 Chrome 또는 Edge로 열면 됩니다.</p><p>현재 선택한 '+s.dans.join('·')+'단이 학생용 파일에 담겨요. 학생 기록은 각자의 기기에 따로 저장돼요.</p>'+btn('download','학생용 HTML 내려받기','button primary wide'));}
function downloadStudent(){if(document.querySelector('script[src]'))return modal('<h2>배포 파일을 사용해 주세요</h2><p>제공된 단일 HTML 파일을 열면 학생용 파일을 내려받을 수 있어요.</p>');let doc=document.documentElement.cloneNode(true);doc.querySelector('#app').innerHTML='';doc.querySelector('#modal').innerHTML='';doc.querySelector('#modal').removeAttribute('open');for(let name of ['gugu-dans','gugu-student'])doc.querySelector('meta[name="'+name+'"]')?.remove();for(let [name,content]of [['gugu-dans',s.dans.join(',')],['gugu-student','1']]){let m=document.createElement('meta');m.name=name;m.content=content;doc.querySelector('head').append(m);}let blob=new Blob(['<!doctype html>'+doc.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='퐁당-바다낚시-학생용.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b||b.disabled||reeling)return;let a=b.dataset.act,n=Number(b.dataset.value);if(a==='close'){document.getElementById('modal').close();return;}if(a==='cast')return cast();if(a==='shop')return shop();if(a==='book')return book();if(a==='settings')return settings();if(a==='share')return share();if(a==='download')return downloadStudent();if(a==='help')return modal('<h2>바다에서 낚시하는 방법</h2><p>① 바다를 누르거나 방향 버튼을 길게 눌러 배를 움직여요.</p><p>② 물고기에 가까이 가서 낚시하기를 눌러요.</p><p>③ 곱셈을 풀고 낚싯줄을 당겨요. 잡으면 물고기 코인, 놓치면 학습 코인 3개!</p><p>④ 코인으로 장비를 강화하면 큰 물고기에 도전할 수 있어요. 연속 두 번 놓치면 다음 정답 낚시는 반드시 성공해요.</p>');if(a==='answer')return settle(Sea.submit(s,n));if(a==='learned')return settle(Sea.resolve(s));if(a==='retry'&&s.q?.phase==='hint')s.q.phase='answer';if(a==='continue'){if(s.result?.caught){let f=fish.find(f=>f.i===s.result.i&&f.cooldown<=0);if(f)f.cooldown=16;}Sea.finish(s);toast='새 물고기를 찾아 항해해요!';}if(a==='upgrade'){if(Sea.upgrade(s)){document.getElementById('modal').close();toast='강화 성공! 낚싯대 Lv.'+s.rod+' · 더 큰 물고기를 찾아요.';}}if(a==='apply'){let ds=[...document.querySelectorAll('input[name=dan]:checked')].map(x=>+x.value);if(!ds.length)return;s.dans=ds;document.getElementById('modal').close();}if(a==='reset-confirm'){document.getElementById('modal').close();return modal('<h2>새 수업을 시작할까요?</h2><p>코인·장비·수집 기록을 지웁니다. 선택한 단은 유지합니다.</p>'+btn('reset','기록 지우고 시작','button primary'));}if(a==='reset'){let ds=s.dans;s=Sea.fresh();s.dans=ds;dest=null;held=null;keys.clear();touches.clear();motion.vx=motion.vy=0;document.getElementById('modal').close();toast='새 항해를 시작해요!';}save();refresh();});
document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-dir]');if(b&&!s.q&&!document.getElementById('modal').open){touches.set(e.pointerId,b.dataset.dir);b.setPointerCapture(e.pointerId);e.preventDefault();}});
document.addEventListener('pointerup',e=>touches.delete(e.pointerId));document.addEventListener('pointercancel',e=>touches.delete(e.pointerId));document.addEventListener('lostpointercapture',e=>touches.delete(e.pointerId));
const keyDirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{let d=keyDirs[e.key];if(d&&!s.q&&!document.getElementById('modal').open){keys.add(d);e.preventDefault();}});
document.addEventListener('keyup',e=>{let d=keyDirs[e.key];if(d){keys.delete(d);e.preventDefault();}});
function releaseControls(){keys.clear();touches.clear();held=null;}
window.addEventListener('blur',releaseControls);document.addEventListener('visibilitychange',()=>{releaseControls();save();});
shell();save();requestAnimationFrame(frame);
</script></body></html>
