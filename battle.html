</style></head><body><div class="game"><header><div class="logo"><span>⚑</span><div>구구 배틀<small>말랑 수비대</small></div></div><div class="top-actions"><button id="sound" aria-label="소리 켜기">♪ OFF</button><button id="pause">Ⅱ 쉬기</button></div></header><section class="battlefield"><div class="battle-top"><div class="castle-status"><span>우리 성 <b id="hp-text"></b></span><div class="health"><i id="hp"></i></div></div><div class="stage-name" id="stage-name">출전 준비</div><div class="castle-status enemy"><span id="enemy-title">상대 성</span><div class="health"><i id="enemy-hp"></i></div></div></div><canvas id="field" aria-label="아군과 상대가 자동으로 전투하는 전장"></canvas><div class="battle-bottom"><span id="timer">03:00</span><span id="battle-note">곱셈으로 우리 수비대를 출전시켜요</span><span id="score">0점</span></div></section><section class="command"><div class="resource"><strong id="points">⚡ 30 P</strong><span id="combo">첫 정답에 도전!</span><button id="help">?</button></div><div class="troops" id="troops"></div><div class="specials"><div class="charge"><span>필살기 <b id="charge-text">0/5</b></span><div id="charge"></div></div><button id="rain">🏹 화살비</button><button id="shield">🛡 보호막</button></div></section><section class="quiz"><div class="quiz-head"><span>곱셈 충전소</span><span id="speed">기본 10P + 속도 보너스</span></div><div id="equation" class="equation">준비됐나요?</div><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite">정답을 맞히면 병력을 보낼 수 있어요.</div></section><footer>정확하게 풀고, 병력을 골라 출전! <span id="save-note">기록은 이 브라우저에 저장돼요.</span></footer></div><dialog id="dialog"></dialog><script>'use strict';
const Battle=(()=>{
 const units=[{name:'병사',icon:'🛡️',cost:12,hp:72,damage:11,range:31,speed:34,rate:1.15},{name:'궁수',icon:'🏹',cost:24,hp:48,damage:17,range:155,speed:27,rate:1.35},{name:'블래스터',icon:'🔫',cost:38,hp:68,damage:15,range:125,speed:29,rate:.65},{name:'대포',icon:'💣',cost:60,hp:115,damage:43,range:205,speed:17,rate:2.1,splash:65},{name:'로켓 포대',icon:'🚀',cost:90,hp:145,damage:78,range:235,speed:14,rate:3,splash:95}];
 const stages=['훈련장','바람 초원','별빛 요새','대포 언덕','왕슬라임의 성'];
 function fresh(stage=1,mode='campaign',dans=[2,3,4,5,6,7,8,9]){return{stage,mode,dans,time:180,elapsed:0,points:30,score:0,correct:0,attempts:0,combo:0,bestCombo:0,energy:0,hp:340,maxHp:340,enemyHp:170+stage*55,enemyMax:170+stage*55,army:[],shots:[],sparks:[],nextId:0,spawn:10,q:null,ended:null,shield:0,flash:0,wave:1,bossMade:false,bossDefeated:false,deployed:0};}
 function question(s,rng=Math.random){let a=s.dans[Math.floor(rng()*s.dans.length)],b=2+Math.floor(rng()*8),answer=a*b,wrong=[...new Set([answer+a,Math.max(1,answer-a),answer+b,Math.max(1,answer-b)])].filter(x=>x!==answer);let choices=[answer,...wrong.slice(0,2)];for(let i=2;i>0;i--){let j=Math.floor(rng()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}s.q={a,b,answer,choices,age:0,disabled:[],locked:false};return s.q;}
 function answer(s,n){let q=s.q;if(s.ended||!q||q.locked||!q.choices.includes(n)||q.disabled.includes(n))return null;s.attempts++;if(n!==q.answer){q.disabled.push(n);s.combo=0;return{ok:false,hint:q.disabled.length>=2?`${q.a}씩 ${q.b}묶음 = ${q.answer}`:`${q.a} × ${q.b-1} = ${q.a*(q.b-1)}, 여기에 ${q.a}을 더해요.`};}q.locked=true;s.correct++;s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);let speed=q.disabled.length?0:q.age<=3?5:q.age<=6?2:0,combo=s.combo%5===0?8:s.combo%3===0?4:0,points=10+speed+combo;s.points+=points;s.score+=100+speed*10+combo*5;s.energy=Math.min(5,s.energy+1);return{ok:true,points,speed,combo};}
 function level(s){return s.mode==='challenge'?Math.min(5,1+Math.floor(s.elapsed/30)):s.stage;}
 function spawn(s,type,side=1,boss=false){let u=units[type],scale=side===1?1+(level(s)-1)*.12: .72+(s.stage-1)*.11+(s.wave-1)*.08,entity={id:s.nextId++,type,side,x:side===1?95:905,hp:u.hp*scale,max:u.hp*scale,damage:u.damage*scale,range:u.range,speed:u.speed,rate:u.rate,cool:.2,boss,hit:0};if(boss){entity.hp=entity.max=390;entity.damage=21;entity.speed=12;entity.range=44;entity.rate=1.5;}s.army.push(entity);return entity;}
 function deploy(s,type){if(s.ended||type<0||type>=level(s)||s.points<units[type].cost||s.army.filter(u=>u.side===1).length>=14)return false;s.points-=units[type].cost;s.deployed++;spawn(s,type);return true;}
 function special(s,type){if(s.ended||s.energy<5||!['rain','shield'].includes(type))return false;s.energy=0;s.flash=1.5;if(type==='shield')s.shield=9;else{for(let u of s.army)if(u.side===-1){u.hp-=u.boss?100:85;u.hit=.3;}s.enemyHp-=22;}return true;}
 function step(s,dt,rng=Math.random){if(s.ended)return;s.time=Math.max(0,s.time-dt);s.elapsed+=dt;if(s.q)s.q.age+=dt;s.shield=Math.max(0,s.shield-dt);s.flash=Math.max(0,s.flash-dt);s.spawn-=dt;
 if(s.stage===5&&!s.bossMade){spawn(s,0,-1,true);s.bossMade=true;}
 if(s.spawn<=0){let limit=s.mode==='challenge'?level(s):s.stage;spawn(s,Math.floor(rng()*Math.min(limit,3)),-1);s.spawn=Math.max(3.6,8-s.stage*.5-s.wave*.2);}
 for(let u of s.army){if(u.hp<=0)continue;u.cool-=dt;u.hit=Math.max(0,u.hit-dt);let targets=s.army.filter(v=>v.side!==u.side&&v.hp>0).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x)),target=targets[0],castle=u.side===1?925:75,distance=target?Math.abs(target.x-u.x):Math.abs(castle-u.x);if(distance<=u.range){if(u.cool<=0){u.cool=u.rate;let damage=u.damage*(u.side===-1&&s.shield>0?.25:1),tx=target?target.x:castle;s.shots.push({x:u.x,to:tx,side:u.side,type:u.type,life:.28,max:.28});if(target){target.hp-=damage;target.hit=.25;if(units[u.type].splash)for(let v of targets.slice(1))if(Math.abs(v.x-target.x)<units[u.type].splash)v.hp-=damage*.55;}else if(u.side===1)s.enemyHp-=damage;else s.hp-=damage;}}else u.x+=u.side*u.speed*dt;}
 s.army=s.army.filter(u=>{if(u.hp>0)return true;if(u.side===-1){s.score+=u.boss?400:20;if(u.boss)s.bossDefeated=true;s.sparks.push({x:u.x,life:.6});}return false;});for(let a of s.shots)a.life-=dt;s.shots=s.shots.filter(a=>a.life>0);for(let a of s.sparks)a.life-=dt;s.sparks=s.sparks.filter(a=>a.life>0);
 if(s.hp<=0)s.ended='defeat';else if(s.enemyHp<=0&&(!s.bossMade||s.bossDefeated)){if(s.mode==='challenge'){s.score+=300;s.wave++;s.enemyMax+=55;s.enemyHp=s.enemyMax;s.points+=20;}else{s.score+=Math.round(s.time)*3+300;s.ended='victory';}}else if(s.time<=0)s.ended=s.mode==='challenge'?'complete':'timeout';
 }
 return{units,stages,fresh,question,answer,level,spawn,deploy,special,step};
})();

</script><script>'use strict';
const $=id=>document.getElementById(id),KEY='gugu-battle-v1';let store={unlocked:1,best:0,stars:{},dans:[2,3,4,5,6,7,8,9]},storage=true;

store.unlocked=Math.max(1,Math.min(5,Number(store.unlocked)||1));store.dans=store.dans.filter(n=>Number.isInteger(n)&&n>=2&&n<=9);if(!store.dans.length)store.dans=[2,3,4,5,6,7,8,9];
let spriteScale=1;let s=null,selected=store.unlocked,paused=true,last=0,waitNext=0,finished=false,audio=null,sound=false,notice='',lastUI='',troopUI='',answerUI='',remainingUI='';const canvas=$('field'),ctx=canvas.getContext('2d'),dialog=$('dialog');
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storage=false;}$('save-note').textContent=storage?'기록은 이 브라우저에 저장돼요.':'저장 불가 · 현재 게임은 계속할 수 있어요.';}
function beep(freq=660){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.start();o.stop(audio.currentTime+.12);}catch(e){}}
function show(html){paused=true;dialog.innerHTML=html;dialog.showModal();}
function close(){dialog.close();paused=!s||!!s.ended;last=performance.now();}
function menu(){show(`<div class="eyebrow">MULTIPLICATION × LITTLE STRATEGY</div><div class="hero-icon">🛡️ 🏹 💣</div><h1>구구 배틀 · 말랑 수비대</h1><p>정답으로 에너지를 충전하고, 병력을 골라 출전!<br>궁수와 대포를 지키며 왕슬라임의 성을 공략해요.</p><div class="instructions"><div>① 곱셈 정답<b>10P + 보너스</b>빠르고 정확하게!</div><div>② 병력 버튼<b>자동 전투</b>모아서 강한 병력도!</div><div>③ 정답 5개<b>필살기 충전</b>화살비 또는 보호막</div></div><div class="stage-grid">${Battle.stages.map((name,i)=>`<button data-stage="${i+1}" class="${selected===i+1?'chosen':''}" ${i+1>store.unlocked?'disabled':''}><b>${i+1>store.unlocked?'🔒':Battle.units[i].icon}</b>${i+1}. ${name}${store.stars[i+1]?' ★':''}</button>`).join('')}</div><button class="primary" data-action="start">스테이지 ${selected} 출전하기</button><button class="secondary" data-action="challenge">⏱ 3분 점수 도전 · 최고 ${store.best.toLocaleString()}점</button><details><summary class="muted">연습할 단 선택</summary><div class="dan-options">${[2,3,4,5,6,7,8,9].map(n=>`<label><input name="dan" type="checkbox" value="${n}" ${store.dans.includes(n)?'checked':''}>${n}단</label>`).join('')}</div><p class="muted">다음 출전에 적용해요. 기록 경쟁은 같은 단으로 비교해요.</p></details><p class="muted">컴퓨터와 대결 · 가입 없음 · 실제 친구와 실시간 대전하는 모드는 아니에요.<br>정답을 천천히 풀어도 기본 10P! 오답은 다시 도전할 수 있어요.</p><div class="version">첫 번째 원정 · v1.0</div>`);}
function start(mode){let ds=[...dialog.querySelectorAll('input[name=dan]:checked')].map(n=>+n.value);if(dialog.querySelector('input[name=dan]')){if(!ds.length){let p=document.createElement('p');p.textContent='연습할 단을 하나 이상 골라 주세요.';dialog.append(p);return;}store.dans=ds;}save();s=Battle.fresh(mode==='challenge'?1:selected,mode,store.dans);Battle.question(s);finished=false;waitNext=0;lastUI=troopUI=answerUI='';notice='병사 버튼을 눌러 첫 수비대를 보내세요!';close();render();}
function choose(n){if(paused||waitNext>0||!s)return;let r=Battle.answer(s,n);if(!r)return;if(r.ok){waitNext=.45;notice='정답! +'+r.points+'P'+(r.speed?' · 속도 +'+r.speed:'')+(r.combo?' · 콤보 +'+r.combo:'');beep(720);answerUI='';}else{notice='다시 생각해요 · '+r.hint;beep(260);answerUI='';}render();}
function render(){if(!s)return;let lv=Battle.level(s);$('points').textContent='⚡ '+s.points+' P';$('combo').textContent=s.combo?s.combo+'연속 정답'+(s.combo>=3?' 🔥':''):'정확하게 풀어 충전!';$('hp-text').textContent=Math.max(0,Math.ceil(s.hp));$('hp').style.width=Math.max(0,s.hp/s.maxHp*100)+'%';$('enemy-hp').style.width=Math.max(0,s.enemyHp/s.enemyMax*100)+'%';$('enemy-title').textContent=s.stage===5?'왕슬라임의 성':'상대 성';$('stage-name').textContent=s.mode==='challenge'?'점수 도전 · 전투력 Lv.'+lv:'STAGE '+s.stage+' · '+Battle.stages[s.stage-1];$('timer').textContent=String(Math.floor(Math.ceil(s.time)/60)).padStart(2,'0')+':'+String(Math.ceil(s.time)%60).padStart(2,'0');$('score').textContent=s.score.toLocaleString()+'점';$('battle-note').textContent=s.shield>0?'보호막! 피해 75% 감소 · '+Math.ceil(s.shield)+'초':s.bossMade&&!s.bossDefeated?'왕슬라임 등장! 병사로 앞을 지켜요.':'아군 전투력 +'+Math.round((lv-1)*12)+'% · '+(s.mode==='challenge'?'공세 '+s.wave:Battle.units[lv-1].name+'까지 출전');
 let tu=lv+'|'+Battle.units.map((u,i)=>s.points>=u.cost?'1':'0').join('')+'|'+(s.army.filter(u=>u.side===1).length>=14);if(tu!==troopUI){troopUI=tu;$('troops').innerHTML=Battle.units.map((u,i)=>`<button class="troop ${i>=lv?'locked':''}" data-unit="${i}" ${i>=lv||s.points<u.cost||s.army.filter(u=>u.side===1).length>=14?'disabled':''} aria-label="${u.name} 출전 ${i>=lv?'잠김':u.cost+' 포인트'}"><span class="icon">${i>=lv?'🔒':u.icon}</span><b>${u.name}</b><small>${i>=lv?'Lv.'+(i+1)+' 해금':u.cost+' P'}</small></button>`).join('');}
 $('charge-text').textContent=s.energy+'/5';$('charge').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<s.energy?'on':''}"></i>`).join('');$('rain').disabled=$('shield').disabled=s.energy<5;let q=s.q;if(q){$('equation').textContent=q.a+' × '+q.b+' = ?';$('speed').textContent=q.locked?'충전 완료!':q.age<=3?'⚡ 빠른 정답 +5P':q.age<=6?'⚡ 정답 보너스 +2P':'차근차근 · 정답은 기본 10P';let au=q.a+'|'+q.b+'|'+q.choices+'|'+q.disabled+'|'+q.locked;if(au!==answerUI){answerUI=au;$('answers').innerHTML=q.choices.map(n=>`<button class="answer ${q.disabled.includes(n)?'wrong':''} ${q.locked&&n===q.answer?'correct':''}" data-answer="${n}" ${q.disabled.includes(n)||q.locked?'disabled':''}>${n}</button>`).join('');}}$('feedback').textContent=notice;}
function result(){if(finished)return;finished=true;paused=true;let win=s.ended==='victory',accuracy=s.attempts?Math.round(s.correct/s.attempts*100):0;if(win){store.stars[s.stage]=true;store.unlocked=Math.max(store.unlocked,Math.min(5,s.stage+1));}if(s.mode==='challenge')store.best=Math.max(store.best,s.score);save();let next=win&&s.stage<5;show(`<div class="hero-icon">${win?'🏆':s.ended==='complete'?'⭐':'🛡️'}</div><h1>${win?s.stage===5?'왕슬라임 공략 성공!':'스테이지 승리!':s.ended==='complete'?'3분 도전 완료!':s.ended==='timeout'?'작전 시간 종료':'다음 작전에서 다시 도전!'}</h1><div class="record"><strong>${s.score.toLocaleString()}점</strong><br>정답 ${s.correct}개 · 정답률 ${accuracy}%<br>최고 ${s.bestCombo}연속 정답 · 병력 ${s.deployed}회 출전</div>${next?`<div class="new-unit"><div class="big">${Battle.units[s.stage].icon}</div><b>${Battle.units[s.stage].name} 해금!</b><p>다음 스테이지에서 아군 체력·공격력도 12%p 상승해요.</p></div>`:win?'<p>모든 병종이 열렸어요. 이제 3분 도전에서 최고 점수에 도전해요!</p>':'<p>병사로 앞을 지키고, 궁수·대포를 뒤에 배치해 보세요.<br>필살기는 정답 5개마다 다시 충전돼요.</p>'}<button class="primary" data-action="${next?'next':'retry'}">${next?'다음 스테이지로':'같은 조건으로 다시 도전'}</button><button class="secondary" data-action="menu">작전 지도</button>`);}
function help(){show('<h2>작전 설명서</h2><p>① 곱셈 정답으로 기본 10P를 얻어요. 첫 시도에서 3초 안에 맞히면 +5P, 6초 안에는 +2P예요.</p><p>② 3연속 정답마다 +4P, 5연속 정답마다 +8P예요. 오답은 포인트 차감 없이 다시 도전! 연속 기록은 새로 시작해요.</p><p>③ 병력 버튼을 눌러 출전시켜요. 병사는 앞에서 버티고, 궁수와 대포는 뒤에서 공격해요. 한 번에 아군 14명까지 출전할 수 있어요.</p><p>④ 정답 5개로 필살기를 충전해요. 화살비는 적 전체 공격, 보호막은 9초 동안 받는 피해를 75% 줄여요. 하나를 쓰면 다시 충전해야 해요.</p><p>⑤ 스테이지가 오르면 새 병종과 전투력 보너스가 열려요. 마지막 성에는 왕슬라임이 등장해요!</p><p>3분 도전에서는 30초마다 병종이 열려요. 성을 공략하면 다음 공세! 점수는 포인트를 사용해도 줄지 않아요.</p><button class="primary" data-action="resume">전투로 돌아가기</button>');}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.answer!==undefined)return choose(+b.dataset.answer);if(b.dataset.unit!==undefined){if(!paused&&Battle.deploy(s,+b.dataset.unit)){notice=Battle.units[+b.dataset.unit].name+' 출전!';beep(450);render();}return;}if(b.dataset.stage){selected=+b.dataset.stage;menu();return;}let a=b.dataset.action;if(a==='start')start('campaign');if(a==='challenge')start('challenge');if(a==='menu')menu();if(a==='resume')close();if(a==='retry'){selected=s.stage;start(s.mode);}if(a==='next'){selected=Math.min(5,s.stage+1);start('campaign');}});
$('rain').onclick=()=>{if(!paused&&Battle.special(s,'rain')){notice='화살비! 모든 적에게 집중 공격!';beep(900);render();}};$('shield').onclick=()=>{if(!paused&&Battle.special(s,'shield')){notice='보호막! 9초 동안 아군과 성을 보호해요.';beep(520);render();}};$('help').onclick=()=>{if(s&&!s.ended)help();};$('pause').onclick=()=>{if(!s||s.ended)return menu();show('<h2>잠시 쉬어 가요</h2><p>전투와 문제 시간이 모두 멈췄어요.</p><button class="primary" data-action="resume">계속하기</button><button class="secondary" data-action="menu">작전 지도 · 현재 전투 나가기</button>');};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ ON':'♪ OFF';$('sound').setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');beep();};dialog.addEventListener('cancel',e=>{e.preventDefault();if(s&&!s.ended)close();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&!s.ended&&!dialog.open)$('pause').click();});
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function dot(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
const palettes=[['#d9ecce','#a4c68b','#84b485'],['#e9edc1','#bbcc86','#96b474'],['#dddcef','#b4bdd4','#8d9bb8'],['#eddfc5','#c6b08a','#a99473'],['#dcd9ee','#acacd0','#8d8fb3']];
function castle(x,side,lv){let color=side===1?'#7eada0':'#bd9b9b',trim=side===1?'#568b81':'#9f7f90',y=116;ctx.save();ctx.translate(x,y);ctx.scale(Math.max(1,spriteScale*.8),1);round(-31,-33,62,64,7,color);round(-39,-48,18,75,6,trim);round(21,-48,18,75,6,trim);for(let j=-1;j<=1;j++)round(j*20-5,-44,10,15,2,color);round(-10,7,20,25,10,'#526b6c');round(-20,-21,10,13,4,'#f5edbc');round(10,-21,10,13,4,'#f5edbc');ctx.strokeStyle=trim;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-41);ctx.lineTo(0,-78-lv*2);ctx.stroke();ctx.fillStyle=side===1?'#ffe2a0':'#eeae9d';ctx.beginPath();ctx.moveTo(1,-79-lv*2);ctx.lineTo(27,-70-lv*2);ctx.lineTo(1,-60-lv*2);ctx.fill();if(lv>=3){dot(-30,-53,10,'#fff0b9');dot(30,-53,10,'#fff0b9');}if(lv>=5){ctx.fillStyle='#e9c370';ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText('♛',0,-43);}ctx.restore();}
function unit(u,t){let y=147+(u.id%3)*8,bob=Math.sin(t*.006+u.id)*1.5;ctx.save();ctx.translate(u.x,y+bob);ctx.scale(u.side*spriteScale,1);let body=u.side===1?'#73ad9a':'#dba08c',dark=u.side===1?'#4f887e':'#ad817c';dot(0,7,13,'#375c4220');if(u.boss){ctx.fillStyle='#a99aca';ctx.beginPath();ctx.ellipse(0,-12,29,33,0,Math.PI,Math.PI*2);ctx.lineTo(29,10);ctx.quadraticCurveTo(0,20,-29,10);ctx.closePath();ctx.fill();dot(-10,-9,3,'#615976');dot(10,-9,3,'#615976');ctx.fillStyle='#f0cf7c';ctx.beginPath();ctx.moveTo(-17,-44);ctx.lineTo(-17,-56);ctx.lineTo(-5,-50);ctx.lineTo(0,-61);ctx.lineTo(6,-50);ctx.lineTo(17,-56);ctx.lineTo(17,-44);ctx.fill();round(-27,-72,54,5,3,'#eee5fa');round(-27,-72,54*Math.max(0,u.hp/u.max),5,3,'#ad80c9');ctx.restore();return;}
 if(u.type>=3){round(-16,-9,31,17,5,body);dot(-10,10,7,dark);dot(11,10,7,dark);ctx.save();ctx.rotate(-.2);round(0,-15,31,11,4,dark);ctx.restore();if(u.type===4){round(-14,-23,35,10,4,'#d9be72');round(-14,-35,35,10,4,'#e4ce93');}}else{round(-9,-12,18,23,6,body);round(-9,9,7,9,3,dark);round(3,9,7,9,3,dark);dot(0,-20,11,'#f4dcb7');round(-12,-31,24,12,5,dark);dot(4,-20,1.5,'#4c625c');if(u.type===0){round(8,-10,13,21,6,'#d8e3bd');ctx.strokeStyle='#d4bd7d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(17,-9);ctx.lineTo(24,-28);ctx.stroke();}if(u.type===1){ctx.strokeStyle='#bca472';ctx.lineWidth=3;ctx.beginPath();ctx.arc(12,-12,14,-1.3,1.3);ctx.stroke();}if(u.type===2)round(6,-12,26,8,3,'#d8c78e');}
 if(u.hit>0){ctx.globalAlpha=.5;dot(0,-10,19,'#fff8cd');ctx.globalAlpha=1;}round(-14,-43,28,4,2,'#fff8de');round(-14,-43,28*Math.max(0,u.hp/u.max),4,2,body);ctx.restore();}
function draw(t){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}spriteScale=Math.min(2.1,1000/w);ctx.setTransform(w/1000*dpr,0,0,h/260*dpr,0,0);let lv=s?Battle.level(s):1,p=palettes[lv-1];ctx.fillStyle=p[0];ctx.fillRect(0,0,1000,260);ctx.fillStyle='#fffdf25c';for(let j=0;j<5;j++){ctx.beginPath();ctx.ellipse(70+j*220,88,110,34,0,Math.PI,0);ctx.fill();}ctx.fillStyle=p[1];ctx.beginPath();ctx.moveTo(0,140);for(let x=0;x<=1000;x+=50)ctx.lineTo(x,130+Math.sin(x*.012)*12);ctx.lineTo(1000,260);ctx.lineTo(0,260);ctx.fill();round(45,160,910,39,20,'#f5e6b9a6');for(let j=0;j<38;j++){let x=(j*97)%1000,y=210+(j*17)%35;dot(x,y,2,p[2]);}castle(49,1,lv);castle(951,-1,s?.stage||1);if(s){for(let u of s.army)unit(u,t);for(let b of s.shots){let f=1-b.life/b.max,x=b.x+(b.to-b.x)*f;ctx.strokeStyle=b.side===1?'#fff5c4':'#b57782';ctx.lineWidth=b.type>=3?5:2;ctx.beginPath();ctx.moveTo(x-9*b.side,139);ctx.lineTo(x,136);ctx.stroke();dot(x,136,b.type>=3?4:2,'#f9e3a1');}for(let a of s.sparks){ctx.globalAlpha=a.life/.6;for(let k=0;k<5;k++)dot(a.x+Math.cos(k*1.25)*(1-a.life)*32,150+Math.sin(k*1.25)*(1-a.life)*25,4,'#fff8ca');ctx.globalAlpha=1;}if(s.shield>0){ctx.strokeStyle='#e6fff0b0';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(62,140,57,78,0,Math.PI,0);ctx.stroke();}if(s.flash>0&&!s.shield){ctx.strokeStyle='#fff9c7';ctx.lineWidth=3;for(let j=0;j<12;j++){let x=200+j*66,y=(t*.4+j*29)%140;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12,y+22);ctx.stroke();}}}}
function frame(t){let dt=Math.min(.05,(t-last)/1000)||0;last=t;if(s&&!paused&&!s.ended){Battle.step(s,dt);if(waitNext>0){waitNext-=dt;if(waitNext<=0){Battle.question(s);answerUI='';}}render();if(s.ended)result();}draw(t);requestAnimationFrame(frame);}save();menu();requestAnimationFrame(frame);

</script></body></html>
