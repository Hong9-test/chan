const Battle=(()=>{
 const units=[{name:'병사',icon:'🛡️',cost:12,hp:72,damage:11,range:31,speed:34,rate:1.15},{name:'궁수',icon:'🏹',cost:24,hp:48,damage:17,range:155,speed:27,rate:1.35},{name:'블래스터',icon:'🔫',cost:38,hp:68,damage:15,range:125,speed:29,rate:.65},{name:'대포',icon:'💣',cost:60,hp:115,damage:43,range:205,speed:17,rate:2.1,splash:65},{name:'로켓 포대',icon:'🚀',cost:90,hp:145,damage:78,range:235,speed:14,rate:3,splash:95}];
 const stages=['훈련장','바람 초원','별빛 요새','대포 언덕','왕슬라임의 성'];
 function fresh(stage=1,mode='campaign',dans=[2,3,4,5,6,7,8,9]){return{stage,mode,dans,time:180,elapsed:0,points:30,score:0,correct:0,attempts:0,combo:0,bestCombo:0,energy:0,hp:340,maxHp:340,enemyHp:170+stage*55,enemyMax:170+stage*55,army:[],shots:[],sparks:[],nextId:0,spawn:10,q:null,ended:null,shield:0,flash:0,wave:1,bossMade:false,bossDefeated:false,deployed:0};}
 function question(s,rng=Math.random){let a=s.dans[Math.floor(rng()*s.dans.length)],b=2+Math.floor(rng()*8),answer=a*b,wrong=[...new Set([answer+a,Math.max(1,answer-a),answer+b,Math.max(1,answer-b)])].filter(x=>x!==answer);let choices=[answer,...wrong.slice(0,2)];for(let i=2;i>0;i--){let j=Math.floor(rng()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}s.q={a,b,answer,choices,age:0,disabled:[],locked:false};return s.q;}
 function answer(s,n){let q=s.q;if(s.ended||!q||q.locked||!q.choices.includes(n)||q.disabled.includes(n))return null;s.attempts++;if(n!==q.answer){q.disabled.push(n);s.combo=0;return{ok:false,hint:q.disabled.length>=2?`${q.a}씩 ${q.b}묶음 = ${q.answer}`:`${q.a} × ${q.b-1} = ${q.a*(q.b-1)}, 여기에 ${q.a}을 더해요.`};}q.locked=true;s.correct++;s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);let speed=q.disabled.length?0:q.age<=3?5:q.age<=6?2:0,combo=s.combo%5===0?8:s.combo%3===0?4:0,points=10+speed+combo;s.points+=points;s.score+=100+speed*10+combo*5;s.energy=Math.min(5,s.energy+1);return{ok:true,points,speed,combo};}

function show(html){if($('quiz-dialog').open)$('quiz-dialog').close();paused=true;dialog.innerHTML=html;dialog.showModal();}
function close(){dialog.close();paused=!s||!!s.ended;last=performance.now();}
function menu(){show(`<div class="eyebrow">MULTIPLICATION × LITTLE STRATEGY</div><div class="hero-icon">🛡️ 🏹 💣</div><h1>구구 배틀 · 말랑 수비대</h1><p>정답으로 에너지를 충전하고, 병력을 골라 출전!<br>궁수와 대포를 지키며 왕슬라임의 성을 공략해요.</p><div class="instructions"><div>① 곱셈 충전<b>10P + 보너스</b>빠르고 정확하게!</div><div>② 병력 버튼<b>자동 전투</b>모아서 강한 병력도!</div><div>③ 정답 5개<b>필살기 충전</b>화살비 또는 보호막</div></div><div class="stage-grid">${Battle.stages.map((name,i)=>`<button data-stage="${i+1}" class="${selected===i+1?'chosen':''}" ${i+1>store.unlocked?'disabled':''}><b>${i+1>store.unlocked?'🔒':Battle.units[i].icon}</b>${i+1}. ${name}${store.stars[i+1]?' ★':''}</button>`).join('')}</div><button class="primary" data-action="start">스테이지 ${selected} 출전하기</button><button class="secondary" data-action="challenge">⏱ 3분 점수 도전 · 최고 ${store.best.toLocaleString()}점</button><details><summary class="muted">연습할 단 선택</summary><div class="dan-options">${[2,3,4,5,6,7,8,9].map(n=>`<label><input name="dan" type="checkbox" value="${n}" ${store.dans.includes(n)?'checked':''}>${n}단</label>`).join('')}</div><p class="muted">다음 출전에 적용해요. 기록 경쟁은 같은 단으로 비교해요.</p></details><p class="muted">컴퓨터와 대결 · 가입 없음 · 실제 친구와 실시간 대전하는 모드는 아니에요.<br>정답을 천천히 풀어도 기본 10P! 오답은 다시 도전할 수 있어요.</p><div class="version">말랑 성채 업데이트 · v1.1</div>`);}
function start(mode){let ds=[...dialog.querySelectorAll('input[name=dan]:checked')].map(n=>+n.value);if(dialog.querySelector('input[name=dan]')){if(!ds.length){let p=document.createElement('p');p.textContent='연습할 단을 하나 이상 골라 주세요.';dialog.append(p);return;}store.dans=ds;}save();s=Battle.fresh(mode==='challenge'?1:selected,mode,store.dans);Battle.question(s);finished=false;waitNext=0;lastUI=troopUI=answerUI='';notice='병사 버튼을 눌러 첫 수비대를 보내세요!';close();render();}
function choose(n){if(paused||waitNext>0||!s||!$('quiz-dialog').open)return;let r=Battle.answer(s,n);if(!r)return;if(r.ok){waitNext=.45;notice='정답! +'+r.points+'P'+(r.speed?' · 속도 +'+r.speed:'')+(r.combo?' · 콤보 +'+r.combo:'');beep(720);answerUI='';}else{notice='다시 생각해요 · '+r.hint;beep(260);answerUI='';}render();}
function render(){if(!s)return;let lv=Battle.level(s);$('points').textContent='⚡ '+s.points+' P';$('combo').textContent=s.combo?s.combo+'연속 정답'+(s.combo>=3?' 🔥':''):'정확하게 풀어 충전!';$('hp-text').textContent=Math.max(0,Math.ceil(s.hp));$('hp').style.width=Math.max(0,s.hp/s.maxHp*100)+'%';$('enemy-hp').style.width=Math.max(0,s.enemyHp/s.enemyMax*100)+'%';$('enemy-title').textContent=s.stage===5?'왕슬라임의 성':'상대 성';$('stage-name').textContent=s.mode==='challenge'?'점수 도전 · 전투력 Lv.'+lv:'STAGE '+s.stage+' · '+Battle.stages[s.stage-1];$('timer').textContent=String(Math.floor(Math.ceil(s.time)/60)).padStart(2,'0')+':'+String(Math.ceil(s.time)%60).padStart(2,'0');$('score').textContent=s.score.toLocaleString()+'점';$('battle-note').textContent=s.shield>0?'보호막! 피해 75% 감소 · '+Math.ceil(s.shield)+'초':s.bossMade&&!s.bossDefeated?'왕슬라임 등장! 병사로 앞을 지켜요.':'아군 전투력 +'+Math.round((lv-1)*12)+'% · '+(s.mode==='challenge'?'공세 '+s.wave:Battle.units[lv-1].name+'까지 출전');
 let tu=lv+'|'+Battle.units.map((u,i)=>s.points>=u.cost?'1':'0').join('')+'|'+(s.army.filter(u=>u.side===1).length>=14);if(tu!==troopUI){troopUI=tu;$('troops').innerHTML=Battle.units.map((u,i)=>`<button class="troop ${i>=lv?'locked':''}" data-unit="${i}" ${i>=lv||s.points<u.cost||s.army.filter(u=>u.side===1).length>=14?'disabled':''} aria-label="${u.name} 출전 ${i>=lv?'잠김':u.cost+' 포인트'}"><span class="icon">${i>=lv?'🔒':u.icon}</span><b>${u.name}</b><small>${i>=lv?'Lv.'+(i+1)+' 해금':u.cost+' P'}</small></button>`).join('');}
 $('charge-text').textContent=s.energy+'/5';$('charge').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<s.energy?'on':''}"></i>`).join('');$('rain').disabled=$('shield').disabled=s.energy<5;let q=s.q;if(q){$('equation').textContent=q.a+' × '+q.b+' = ?';$('speed').textContent=q.locked?'충전 완료!':q.age<=3?'⚡ 빠른 정답 +5P':q.age<=6?'⚡ 정답 보너스 +2P':'차근차근 · 정답은 기본 10P';let au=q.a+'|'+q.b+'|'+q.choices+'|'+q.disabled+'|'+q.locked;if(au!==answerUI){answerUI=au;$('answers').innerHTML=q.choices.map(n=>`<button class="answer ${q.disabled.includes(n)?'wrong':''} ${q.locked&&n===q.answer?'correct':''}" data-answer="${n}" ${q.disabled.includes(n)||q.locked?'disabled':''}>${n}</button>`).join('');}}$('feedback').textContent=notice;$('quiz-wallet').textContent='현재 '+s.points+'P · 정답 '+s.correct+'개';}
function result(){if($('quiz-dialog').open)$('quiz-dialog').close();if(finished)return;finished=true;paused=true;let win=s.ended==='victory',accuracy=s.attempts?Math.round(s.correct/s.attempts*100):0;if(win){store.stars[s.stage]=true;store.unlocked=Math.max(store.unlocked,Math.min(5,s.stage+1));}if(s.mode==='challenge')store.best=Math.max(store.best,s.score);save();let next=win&&s.stage<5;show(`<div class="hero-icon">${win?'🏆':s.ended==='complete'?'⭐':'🛡️'}</div><h1>${win?s.stage===5?'왕슬라임 공략 성공!':'스테이지 승리!':s.ended==='complete'?'3분 도전 완료!':s.ended==='timeout'?'작전 시간 종료':'다음 작전에서 다시 도전!'}</h1><div class="record"><strong>${s.score.toLocaleString()}점</strong><br>정답 ${s.correct}개 · 정답률 ${accuracy}%<br>최고 ${s.bestCombo}연속 정답 · 병력 ${s.deployed}회 출전</div>${next?`<div class="new-unit"><div class="big">${Battle.units[s.stage].icon}</div><b>${Battle.units[s.stage].name} 해금!</b><p>다음 스테이지에서 아군 체력·공격력도 12%p 상승해요.</p></div>`:win?'<p>모든 병종이 열렸어요. 이제 3분 도전에서 최고 점수에 도전해요!</p>':'<p>병사로 앞을 지키고, 궁수·대포를 뒤에 배치해 보세요.<br>필살기는 정답 5개마다 다시 충전돼요.</p>'}<button class="primary" data-action="${next?'next':'retry'}">${next?'다음 스테이지로':'같은 조건으로 다시 도전'}</button><button class="secondary" data-action="menu">작전 지도</button>`);}
function help(){show('<h2>작전 설명서</h2><p>① ‘곱셈 충전’을 누르면 문제창이 열리고 전투가 잠시 멈춰요. 작전 시간은 계속 흘러요. 정답으로 기본 10P를 얻어요. 첫 시도에서 3초 안에 맞히면 +5P, 6초 안에는 +2P예요.</p><p>② 3연속 정답마다 +4P, 5연속 정답마다 +8P예요. 오답은 포인트 차감 없이 다시 도전! 연속 기록은 새로 시작해요.</p><p>③ 병력 버튼을 눌러 출전시켜요. 병사는 앞에서 버티고, 궁수와 대포는 뒤에서 공격해요. 한 번에 아군 14명까지 출전할 수 있어요.</p><p>④ 정답 5개로 필살기를 충전해요. 화살비는 적 전체 공격, 보호막은 9초 동안 받는 피해를 75% 줄여요. 하나를 쓰면 다시 충전해야 해요.</p><p>⑤ 스테이지가 오르면 새 병종과 전투력 보너스가 열려요. 마지막 성에는 왕슬라임이 등장해요!</p><p>3분 도전에서는 30초마다 병종이 열려요. 성을 공략하면 다음 공세! 점수는 포인트를 사용해도 줄지 않아요.</p><button class="primary" data-action="resume">전투로 돌아가기</button>');}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.answer!==undefined)return choose(+b.dataset.answer);if(b.dataset.unit!==undefined){if(!paused&&Battle.deploy(s,+b.dataset.unit)){notice=Battle.units[+b.dataset.unit].name+' 출전!';beep(450);render();}return;}if(b.dataset.stage){selected=+b.dataset.stage;menu();return;}let a=b.dataset.action;if(a==='start')start('campaign');if(a==='challenge')start('challenge');if(a==='menu')menu();if(a==='resume')close();if(a==='retry'){selected=s.stage;start(s.mode);}if(a==='next'){selected=Math.min(5,s.stage+1);start('campaign');}});
$('rain').onclick=()=>{if(!paused&&Battle.special(s,'rain')){notice='화살비! 모든 적에게 집중 공격!';beep(900);render();}};$('shield').onclick=()=>{if(!paused&&Battle.special(s,'shield')){notice='보호막! 9초 동안 아군과 성을 보호해요.';beep(520);render();}};$('help').onclick=()=>{if(s&&!s.ended)help();};$('pause').onclick=()=>{if(!s||s.ended)return menu();show('<h2>잠시 쉬어 가요</h2><p>전투와 문제 시간이 모두 멈췄어요.</p><button class="primary" data-action="resume">계속하기</button><button class="secondary" data-action="menu">작전 지도 · 현재 전투 나가기</button>');};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ ON':'♪ OFF';$('sound').setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');beep();};dialog.addEventListener('cancel',e=>{e.preventDefault();if(s&&!s.ended)close();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&!s.ended&&!dialog.open)$('pause').click();});
function frame(t){let dt=Math.min(.05,(t-last)/1000)||0;last=t;if(s&&!paused&&!s.ended){if($('quiz-dialog').open){s.time=Math.max(0,s.time-dt);s.elapsed+=dt;if(s.q)s.q.age+=dt;if(s.time<=0)s.ended=s.mode==='challenge'?'complete':'timeout';}else{let age=s.q?.age;Battle.step(s,dt);if(s.q&&age!==undefined)s.q.age=age;}if(waitNext>0){waitNext-=dt;if(waitNext<=0){Battle.question(s);answerUI='';}}render();if(s.ended)result();}draw(t);requestAnimationFrame(frame);}$('charge-open').onclick=()=>{if(!s||s.ended||paused)return;notice='정답으로 병력 포인트를 모아요!';$('quiz-dialog').showModal();render();};$('charge-close').onclick=()=>{$('quiz-dialog').close();notice='충전 완료! 병력을 골라 출전시키세요.';};$('quiz-dialog').addEventListener('cancel',e=>{e.preventDefault();$('quiz-dialog').close();});save();menu();requestAnimationFrame(frame);


</script></body></html>
